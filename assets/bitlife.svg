<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-labelledby="title desc">
  <title id="title">BitLife artwork</title>
  <desc id="desc">A bright BitLife inspired game card with choice bubbles.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="0.48" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#06283d" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="640" height="420" rx="44" fill="url(#bg)"/>
  <circle cx="96" cy="82" r="54" fill="#fef08a" opacity="0.92"/>
  <circle cx="542" cy="328" r="88" fill="#ffffff" opacity="0.12"/>
  <circle cx="560" cy="86" r="42" fill="#ffffff" opacity="0.18"/>
  <g filter="url(#shadow)">
    <rect x="150" y="70" width="340" height="280" rx="32" fill="#f8fafc"/>
    <rect x="180" y="104" width="280" height="44" rx="22" fill="#16a34a"/>
    <text x="320" y="136" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#fff">BitLife</text>
    <circle cx="320" cy="206" r="48" fill="#fde68a"/>
    <path d="M288 207c14 23 50 23 64 0" fill="none" stroke="#111827" stroke-width="8" stroke-linecap="round"/>
    <circle cx="300" cy="193" r="6" fill="#111827"/>
    <circle cx="340" cy="193" r="6" fill="#111827"/>
    <rect x="208" y="278" width="224" height="34" rx="17" fill="#e0f2fe"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#075985">
    <rect x="52" y="238" width="150" height="52" rx="26" fill="#fff" opacity="0.88"/>
    <text x="127" y="271" text-anchor="middle">Choose</text>
    <rect x="438" y="176" width="150" height="52" rx="26" fill="#fff" opacity="0.88"/>
    <text x="513" y="209" text-anchor="middle">Live</text>
  </g>
