<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">ChilloutVR artwork</title>
  <desc id="desc">A blue and purple virtual reality inspired ChilloutVR graphic.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#58d7ff"/>
      <stop offset="42%" stop-color="#3846ff"/>
      <stop offset="100%" stop-color="#080620"/>
    </radialGradient>
    <linearGradient id="glow" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#74f6ff"/>
      <stop offset="1" stop-color="#b65cff"/>
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <g opacity="0.18" stroke="#fff" stroke-width="2" fill="none">
    <path d="M0 520 C230 410 360 650 580 520 S970 360 1280 500"/>
    <path d="M0 590 C210 500 420 680 650 560 S990 460 1280 610"/>
    <path d="M160 0 L420 720 M520 0 L760 720 M920 0 L1110 720"/>
  </g>
  <g transform="translate(640 330)" filter="url(#softGlow)">
    <path d="M-250-55 C-220-145-100-175 0-175 S220-145 250-55 C280 35 225 125 135 135 C60 143 45 75 0 75 S-60 143-135 135 C-225 125-280 35-250-55Z" fill="rgba(0,0,0,.48)" stroke="url(#glow)" stroke-width="16"/>
    <circle cx="-105" cy="-20" r="44" fill="none" stroke="#e8fbff" stroke-width="13"/>
    <circle cx="105" cy="-20" r="44" fill="none" stroke="#e8fbff" stroke-width="13"/>
    <path d="M-18-22 H18 M0-40 V0" stroke="#e8fbff" stroke-width="12" stroke-linecap="round"/>
  </g>
  <text x="640" y="560" text-anchor="middle" font-family="Verdana, sans-serif" font-size="82" font-weight="700" fill="#fff" letter-spacing="5">ChilloutVR</text>
  <text x="640" y="615" text-anchor="middle" font-family="Verdana, sans-serif" font-size="26" fill="rgba(255,255,255,.82)" letter-spacing="3">social sandbox metaverse</text>
</svg>
